<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16203A">
<title>SmartDeutschLehrer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Theme "U-Bahn": a dark station sign as the header, every tab a colored line badge (--lc), a departures board on Acasă.
   Article colors (der blue, die red, das green) stay exactly as before; line colors only mark the tabs. */
:root {
  --bg: #F2F1EC; --surface: #FFFFFF; --surface-2: #ECEBE5; --fg: #1A1F2B; --muted: #555B6A; --line: #DCDAD2;
  --sign: #16203A; --sign-fg: #FFFFFF; --sign-muted: #AEB6CC; --board-fg: #FFC94A; --home-c: #16203A;
  --der: #2F6FE0; --die: #D63E3E; --das: #1C9A62;
  --der-soft: #E3ECFC; --die-soft: #FBE5E5; --das-soft: #DDF3E9;
  --accent: #16203A; --accent-fg: #FFFFFF;
  --ok: #1C9A62; --bad: #D63E3E; --warn: #C98500; --meter: #7A869F;
  --shadow: 0 1px 2px rgba(26, 31, 43, .06), 0 4px 14px rgba(26, 31, 43, .06);
  --radius: 10px; --w: 760px; --lc: var(--der);
  --font: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-sign: "Barlow Semi Condensed", "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1320; --surface: #191E2D; --surface-2: #232A3C; --fg: #EEF0F7; --muted: #A0A8BE; --line: #2E3449;
    --sign: #0A0E19; --sign-muted: #8E97AF; --home-c: #3A4A78;
    --der: #6EA0FF; --die: #FF7676; --das: #4FD197;
    --der-soft: #1D2A47; --die-soft: #3A1E22; --das-soft: #173328;
    --accent: #EEF0F7; --accent-fg: #0F1320;
    --ok: #4FD197; --bad: #FF7676; --warn: #F2B544; --meter: #8C9AB8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1320; --surface: #191E2D; --surface-2: #232A3C; --fg: #EEF0F7; --muted: #A0A8BE; --line: #2E3449;
  --sign: #0A0E19; --sign-muted: #8E97AF; --home-c: #3A4A78;
  --der: #6EA0FF; --die: #FF7676; --das: #4FD197;
  --der-soft: #1D2A47; --die-soft: #3A1E22; --das-soft: #173328;
  --accent: #EEF0F7; --accent-fg: #0F1320;
  --ok: #4FD197; --bad: #FF7676; --warn: #F2B544; --meter: #8C9AB8;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25); color-scheme: dark;
}
@media (min-width: 900px) { :root { --w: 880px; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
body { min-height: 100vh; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
/* the station sign: full-width dark band, content aligned with the column below; a strip of all line colors under it */
header { background: var(--sign); color: var(--sign-fg); display: flex; align-items: center; gap: 12px;
  padding: 14px max(16px, calc((100% - var(--w)) / 2 + 16px)) 12px; position: relative; }
header::after { content: ''; position: absolute; left: 0; right: 0; bottom: -4px; height: 4px;
  background: linear-gradient(to right, #2F5FD0 0 14.3%, #7B3FB8 0 28.6%, #C25E12 0 42.9%, #138A55 0 57.2%, #C0283C 0 71.5%, #0B7C8A 0 85.8%, #8A5A2E 0); }
header img { width: 38px; height: 38px; border-radius: 8px; }
header h1 { font: 700 22px/1.15 var(--font-sign); margin: 0; letter-spacing: .01em; }
header .sub { color: var(--sign-muted); font-size: 13px; }
.hright { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.chip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 0; background: rgba(255,255,255,.12); color: var(--sign-fg); white-space: nowrap; cursor: pointer; }
.chip.warn { background: var(--board-fg); color: #1A1F2B; }
.chip[hidden] { display: none; }
.hbtn { border: 0; background: rgba(255,255,255,.08); color: var(--sign-fg); font-size: 20px; line-height: 1; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; }
.hbtn.on { background: rgba(255,255,255,.22); }
@media (max-width: 480px) {
  header { gap: 10px; padding-top: 10px; padding-bottom: 9px; }
  header img { width: 32px; height: 32px; }
  header h1 { font-size: 19px; }
  header .sub { display: none; }
  header > div:not(.hright) { min-width: 0; }
  header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbtn { width: 36px; height: 36px; font-size: 18px; }
}
main { max-width: var(--w); margin: 0 auto; padding: 12px 16px 24px; }
/* line badge: the tab's icon text on its line color */
.lb { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 28px; padding: 0 6px; border-radius: 6px;
  background: var(--lc); color: #fff; font: 700 16px/1 var(--font-sign); letter-spacing: .01em; flex: none; }
.lb.xl { min-width: 48px; height: 40px; font-size: 22px; border-radius: 8px; }
/* phone: one row that scrolls sideways when the tabs don't fit (7+ tabs at 375px); the page itself never scrolls sideways */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: flex; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 5;
  overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scroll-padding: 0 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs.more-r { -webkit-mask-image: linear-gradient(to right, #000 85%, transparent); mask-image: linear-gradient(to right, #000 85%, transparent); }
nav.tabs.more-l { -webkit-mask-image: linear-gradient(to left, #000 85%, transparent); mask-image: linear-gradient(to left, #000 85%, transparent); }
nav.tabs.more-l.more-r { -webkit-mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent); mask-image: linear-gradient(to right, transparent, #000 15%, #000 85%, transparent); }
nav.tabs button { position: relative; flex: 1 0 62px; max-width: 140px; scroll-snap-align: start; border: 0; background: none; color: var(--fg); font: inherit; font-size: 12px; white-space: nowrap;
  padding: 6px 2px 5px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
nav.tabs button .lb { min-width: 32px; height: 24px; font-size: 14px; }
nav.tabs button.on { background: var(--surface-2); font-weight: 600; }
nav.tabs button.on::after { content: ''; position: absolute; left: 22%; right: 22%; bottom: 0; height: 3px; border-radius: 3px; background: var(--lc); }
/* number of prepared lessons on the badge's corner */
nav.tabs .cnt { position: absolute; top: 1px; right: calc(50% - 26px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px;
  background: var(--fg); color: var(--bg); font: 600 11px/17px var(--font); text-align: center; }
body.in-lesson nav.tabs { display: none; }
body.in-lesson { padding-bottom: 24px; }
@media (min-width: 760px) {
  body { padding-bottom: 24px; }
  nav.tabs { position: static; max-width: var(--w); margin: 16px auto 0; border: 0; background: none; gap: 6px; padding: 0 16px; overflow: visible; flex-wrap: wrap;
    -webkit-mask-image: none !important; mask-image: none !important; }
  /* one row of station cards: badge above the name, so all 8 fit without wrapping */
  nav.tabs { flex-wrap: nowrap; }
  nav.tabs button { flex: 1 1 0; min-width: 0; font-size: 13px; padding: 9px 4px 8px; gap: 5px; background: var(--surface); box-shadow: var(--shadow); max-width: none; }
  nav.tabs button .lb { min-width: 38px; height: 28px; font-size: 16px; }
  nav.tabs button.on { background: var(--surface); box-shadow: inset 0 -3px 0 var(--lc), var(--shadow); }
  nav.tabs button.on::after { display: none; }
  nav.tabs .cnt { top: 4px; right: calc(50% - 32px); }
}
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin: 14px 0; }
.card h2 { font: 700 21px/1.25 var(--font-sign); margin: 0 0 6px; letter-spacing: .005em; }
.sign-h { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.sign-h h2 { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 15px; padding: 10px 16px;
  border-radius: 10px; cursor: pointer; }
.btn.primary { background: var(--lc); color: #fff; border-color: var(--lc); font-weight: 600; }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.big { font-size: 17px; padding: 13px 22px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0; }
label.f input { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; font-size: 16px; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.stat { display: flex; gap: 10px; margin: 12px 0; }
.stat div { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 22px; }
.art { font-weight: 700; }
.art.der, .g-m { color: var(--der); } .art.die, .g-f { color: var(--die); } .art.das, .g-n { color: var(--das); }
.msg { margin-top: 10px; font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.msg.ok { background: var(--das-soft); color: var(--das); }
.msg.bad { background: var(--die-soft); color: var(--die); }
.umlauts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.umlauts { flex-wrap: nowrap; }
.umlauts button { flex: 1 1 0; min-width: 0; max-width: 56px; height: 44px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--fg); font: inherit; font-size: 18px; cursor: pointer; }
.umlauts button:active { transform: scale(.96); }
ol.steps { padding-left: 20px; margin: 8px 0; } ol.steps li { margin: 4px 0; }
a { color: var(--der); }

/* ---------- lesson player ---------- */
.ltop { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.bar { flex: 1; height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--lc); border-radius: 99px; transition: width .25s; }
.item { padding: 22px 18px; }
.item .kind { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 10px; }
.sent { font-size: 23px; line-height: 1.6; margin: 0 0 6px; }
.w { cursor: help; border-bottom: 1px dotted transparent; border-radius: 3px; }
.w:hover, .w.tip-on { background: var(--surface-2); border-bottom-color: var(--muted); }
.gap { display: inline-block; min-width: 72px; border-bottom: 3px solid var(--fg); text-align: center; padding: 0 6px; line-height: 1.2; color: var(--muted); }
.gap.ok { border-color: var(--ok); color: var(--ok); font-weight: 600; }
.gap.bad { border-color: var(--bad); color: var(--bad); font-weight: 600; text-decoration: line-through; }
.hint { font-size: 15px; color: var(--muted); }
.hint b { color: var(--fg); }
.ro-btn { border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font: inherit; font-size: 12px; font-weight: 700;
  border-radius: 7px; padding: 3px 8px; cursor: pointer; vertical-align: middle; }
.ro-line { margin: 8px 0 0; color: var(--muted); font-style: italic; min-height: 0; }
.answer { display: flex; gap: 8px; margin-top: 18px; }
.answer input { flex: 1; min-width: 0; padding: 12px 14px; font: inherit; font-size: 20px; color: var(--fg); background: var(--bg);
  border: 2px solid var(--line); border-radius: 12px; }
.answer input:focus { outline: none; border-color: var(--fg); }
.fb { margin-top: 16px; padding: 14px 16px; border-radius: 12px; }
.fb.ok { background: var(--das-soft); }
.fb.bad { background: var(--die-soft); }
.fb h3 { margin: 0 0 4px; font-size: 17px; }
.fb.ok h3 { color: var(--ok); } .fb.bad h3 { color: var(--bad); }
.fb p { margin: 4px 0 0; }
.tip { position: fixed; z-index: 50; max-width: 260px; background: var(--fg); color: var(--bg); padding: 6px 10px; border-radius: 8px;
  font-size: 14px; line-height: 1.35; pointer-events: none; box-shadow: var(--shadow); }
.tip[hidden] { display: none; }
.sum-list { list-style: none; padding: 0; margin: 10px 0 0; }
.sum-list li { padding: 10px 0; border-top: 1px solid var(--line); }
.sum-list .s { font-size: 16px; }
.big-score { font-size: 44px; font-weight: 800; line-height: 1; }

/* ---------- calibration ---------- */
.cal-arts { display: flex; gap: 8px; margin-top: 18px; }
.cal-art { flex: 1; max-width: 120px; padding: 12px 0; font: inherit; font-size: 19px; font-weight: 700; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 2px solid var(--line); }
.cal-art.der { color: var(--der); } .cal-art.die { color: var(--die); } .cal-art.das { color: var(--das); }
.cal-art.der.on { background: var(--der-soft); border-color: var(--der); }
.cal-art.die.on { background: var(--die-soft); border-color: var(--die); }
.cal-art.das.on { background: var(--das-soft); border-color: var(--das); }
.cal-pl { align-items: center; }
.pl-die { font-size: 20px; color: var(--muted); }
.ok-txt { color: var(--ok); } .bad-txt { color: var(--bad); }
.fb s { color: var(--muted); }

/* ---------- word order (tip ordine): tap the tiles into the sentence, tap a placed tile to take it back ---------- */
/* room for the sentence to grow while tiles are placed, so the tiles below don't move under the finger */
.sent.order { min-height: 3.2em; }
@media (max-width: 759px) { .sent.order { min-height: 4.8em; } }
.slot-empty { display: inline-block; min-width: 110px; border-bottom: 3px dashed var(--line); line-height: 1.2; }
.tile { font: inherit; font-size: 18px; line-height: 1.25; padding: 8px 13px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; box-shadow: 0 1px 0 var(--line); touch-action: manipulation; }
.tile:active { transform: scale(.97); }
.tile.placed { font-size: 21px; padding: 0 7px; min-height: 0; margin: 2px 1px; background: var(--der-soft); border-color: var(--der); box-shadow: none; vertical-align: baseline; }
.tile.used { visibility: hidden; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.order-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.built { font-weight: 600; }
.built.ok { color: var(--ok); } .built.bad { color: var(--bad); text-decoration: line-through; }
.ro-gl { display: block; font-style: normal; font-size: 13px; margin-top: 4px; }

/* ---------- profile ---------- */
.sub-h { font-size: 14px; margin: 18px 0 4px; color: var(--muted); font-weight: 600; }
.settings-h { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 2px 0; }
.meters { list-style: none; padding: 0; margin: 8px 0 0; }
.meters li { display: grid; grid-template-columns: minmax(0, 1fr) 90px 48px; gap: 10px; align-items: center; padding: 5px 0; font-size: 14px; }
.m-label { overflow-wrap: anywhere; }
.meter { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.meter i.hi { background: var(--ok); } .meter i.mid { background: var(--meter); }
.m-few { font-size: 12px; color: var(--muted); font-style: italic; text-align: right; }
.m-val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; }
.box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.box-n { font-weight: 700; font-variant-numeric: tabular-nums; }
.box-bar { width: 100%; max-width: 44px; height: 70px; background: var(--surface-2); border-radius: 8px; display: flex; align-items: flex-end; overflow: hidden; }
.box-bar i { display: block; width: 100%; background: var(--der); border-radius: 8px 8px 0 0; }
.box:last-child .box-bar i { background: var(--ok); }
.box-l { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip2 { font-size: 13px; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); }
.chip2.lo { background: var(--die-soft); } .chip2.hi { background: var(--das-soft); }
details.grp { border-top: 1px solid var(--line); padding: 8px 0; }
details.grp summary { cursor: pointer; font-weight: 600; }
.stat div span.small { display: block; }

/* ---------- Acasă: next stop, departures board, profile beside them on wide screens ---------- */
@media (min-width: 900px) { .home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 16px; align-items: start; } }
.kicker { font: 600 12px/1.2 var(--font-sign); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 8px; }
.next { border-top: 5px solid var(--lc); }
.next h2 { font-size: 24px; }
.next .meta { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin: 6px 0 14px; flex-wrap: wrap; }
.dots { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0 14px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--lc); }
.dots i.on { background: var(--lc); }
.dots i.cur { box-shadow: 0 0 0 3px var(--der-soft); }
details.what { margin-top: 12px; font-size: 13px; color: var(--muted); }
details.what summary { cursor: pointer; }
.board { background: var(--sign); color: #E9ECF5; }
.board h2 { color: #fff; }
.board .kicker { color: var(--sign-muted); }
.dep { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 4px; border: 0; border-top: 1px solid rgba(255,255,255,.1);
  background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 0; }
.dep:first-of-type { border-top: 0; }
.dep:hover { background: rgba(255,255,255,.05); }
.dep .d-name { flex: 1; min-width: 0; font-weight: 600; }
.dep .d-name span { display: block; font-weight: 400; font-size: 13px; color: var(--sign-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dep .d-n { font: 700 18px/1 var(--font-sign); color: var(--board-fg); font-variant-numeric: tabular-nums; text-align: right; min-width: 64px; }
.dep .d-n small { display: block; font: 400 11px/1.3 var(--font); color: var(--sign-muted); }
.dep .d-n.zero { color: var(--sign-muted); }
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <div><h1>SmartDeutschLehrer</h1><div class="sub">Gramatică prin drill, fără streak</div></div>
  <div class="hright">
    <button class="chip" id="conn" data-tab="setari" hidden></button>
    <button class="hbtn" id="gear" data-tab="setari" title="Setări" aria-label="Setări">⚙</button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<div class="tip" id="tip" hidden></div>

<script>
const APP_VERSION = 'v15';
const TABS = [
  { id: 'artikel', c: '#2F5FD0', ico: 'der', name: 'Artikel', title: 'Genul substantivelor',
    desc: 'Exersezi <span class="art der">der</span> / <span class="art die">die</span> / <span class="art das">das</span> pe cuvintele tale din Duolingo, cu regulile de terminație (-ung, -chen, -keit…).' },
  { id: 'plural', c: '#7B3FB8', ico: 'Pl', name: 'Plural', title: 'Formele de plural',
    desc: 'Scrii pluralul (<i>das Haus → die Häuser</i>) și exersezi Dativ plural cu -n (<i>mit den Kindern</i>).' },
  { id: 'adjektive', c: '#C25E12', ico: '-en', name: 'Adjektive', title: 'Adjectivele',

let STEP = '';
async function gh(path, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  STEP = `${opts.method || 'GET'} ${path.split('?')[0]}`;
  try {
    return await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}${path}`, { cache: 'no-store', ...opts, signal: ctrl.signal,
      headers: { Authorization: `Bearer ${GH.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) } });
  } catch (e) {

    err.step = STEP;

  } finally { clearTimeout(timer); }
}

// One commit with any number of files; a null value deletes the path (only if it still exists).
async function commitFiles(files, message) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const ref = await ghJson(`/git/ref/heads/${GH.branch}`);
    const head = ref.object.sha;
    const baseTree = (await ghJson(`/git/commits/${head}`)).tree.sha;
    const existing = new Set();
    if (Object.values(files).some(v => v === null)) {
      const t = await ghJson(`/git/trees/${baseTree}?recursive=1`);
      t.tree.forEach(x => existing.add(x.path));
    }
    const entries = [];
    for (const [path, text] of Object.entries(files)) {
      if (text === null) { if (existing.has(path)) entries.push({ path, mode: '100644', type: 'blob', sha: null }); continue; }
      const blob = await ghJson('/git/blobs', { method: 'POST', body: JSON.stringify({ content: enc(text), encoding: 'base64' }) });
      entries.push({ path, mode: '100644', type: 'blob', sha: blob.sha });
    }
    const tree = await ghJson('/git/trees', { method: 'POST', body: JSON.stringify({ base_tree: baseTree, tree: entries }) });
    const commit = await ghJson('/git/commits', { method: 'POST', body: JSON.stringify({ message, tree: tree.sha, parents: [head] }) });
    const u = await gh(`/git/refs/heads/${GH.branch}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha, force: false }) });
    if (u.ok) return commit;
    if (u.status !== 422 && u.status !== 409) throw new GhError(u.status, await u.text());

  if (e?.status === 403) return 'Tokenul nu are voie să scrie (403). Verifică permisiunea Contents: Read and write.';
  if (e?.status === 404) return 'Tokenul nu vede repo-ul de date (404). Verifică numele repo-ului și accesul tokenului la el.';

/* ---------- sync: download prepared lessons, upload finished ones ---------- */
async function pullLessons() {
  const ref = await ghJson(`/git/ref/heads/${GH.branch}`);
  const commit = await ghJson(`/git/commits/${ref.object.sha}`);
  const tree = await ghJson(`/git/trees/${commit.tree.sha}?recursive=1`);
  // prepared lessons + the calibration sittings (calibrare/cal-N.json) use the same player and the same commit
  const remote = tree.tree.filter(x => x.type === 'blob' && /^(lectii\/pregatite\/[^/]+|calibrare)\/[^/]+\.json$/.test(x.path));
  const next = {};
  for (const f of remote) {
    if (LESSONS[f.path]?.sha === f.sha) { next[f.path] = LESSONS[f.path]; continue; }
    const b = await ghJson(`/git/blobs/${f.sha}`);
    try { next[f.path] = { sha: f.sha, data: JSON.parse(dec(b.content)) }; } catch (e) { /* skip broken file */ }
  }
  LESSONS = next;
  store.set('sdl-lessons', LESSONS);
  // the Acasă profile: precomputed by progres.py on the PC each time the generator runs
  const prof = tree.tree.find(x => x.path === 'progres/profil.json');
  if (prof && PROFIL?.sha !== prof.sha) {
    try { PROFIL = { sha: prof.sha, data: JSON.parse(dec((await ghJson(`/git/blobs/${prof.sha}`)).content)) }; store.set('sdl-profil', PROFIL); } catch (e) { /* keep the old one */ }
  }

  DONE = DONE.filter(p => LESSONS[p]);
  store.set('sdl-done', DONE);
}

    ? `App: calibrare ${r.id} (articol ${result.articol.join('/')}, plural ${result.plural.join('/')}, ${result.necunoscute} necunoscute)`

  const upd = new Date(p.actualizat);
  let h = `<section class="card"><div class="row between"><h2>Profilul tău</h2><span class="small muted">actualizat ${esc(isNaN(upd) ? p.actualizat : upd.toLocaleString('ro-RO', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }))}</span></div>
    <p class="muted small">Corecte din prima încercare, pe tot ce ai făcut până acum (lecții și calibrare).</p>
    ${p.taburi?.length ? meters(p.taburi) : '<p class="small muted">Încă niciun răspuns procesat.</p>'}</section>`;

  h += `<section class="card"><h2>De exersat</h2>
    ${p.slabe?.length ? meters(p.slabe) + '<p class="small muted">Generatorul pune accent pe acestea în lecțiile următoare.</p>'
      : '<p class="small muted">Nimic clar încă: e nevoie de cel puțin 3 răspunsuri pe aceeași regulă.</p>'}
    ${p.sigure?.length ? `<h3 class="sub-h">Ce merge bine</h3>${meters(p.sigure)}` : ''}</section>`;

  const s = p.srs || { cutii: [0, 0, 0, 0, 0], total: 0, scadente: 0 };
  const max = Math.max(1, ...s.cutii);
  const lbl = ['1 zi', '3 zile', '7 zile', '14 zile', 'fixat'];
  h += `<section class="card"><h2>Repetiția spațiată</h2>
    <p class="muted small">${s.total} lucruri urmărite (genul sau pluralul unui cuvânt, un tipar de terminație, o prepoziție). Un răspuns corect le mută o cutie la dreapta; unul greșit, înapoi în prima.${s.scadente ? ` <b>${s.scadente}</b> sunt la scadență și intră în lecțiile următoare.` : ''}</p>
    <div class="boxes">${s.cutii.map((n, i) => `<div class="box"><span class="box-n">${n}</span><span class="box-bar"><i style="height:${Math.round(100 * n / max)}%"></i></span><span class="box-l">${lbl[i]}</span></div>`).join('')}</div>
    ${p.de_lucrat?.length ? `<h3 class="sub-h">De lucrat (cutia 1)</h3>${chips(p.de_lucrat, 'lo')}` : ''}
    ${p.fixate?.length ? `<h3 class="sub-h">Fixate</h3>${chips(p.fixate, 'hi')}` : ''}</section>`;

  const c = p.calibrare;
  if (c && c.facute) h += `<section class="card"><h2>Calibrare</h2>
    <div class="stat">${c.articol[1] ? `<div><span class="muted small">Articol</span><b>${pct(c.articol[0], c.articol[1])}</b><span class="small muted">${c.articol[0]}/${c.articol[1]}</span></div>
      <div><span class="muted small">Plural</span><b>${pct(c.plural[0], c.plural[1])}</b><span class="small muted">${c.plural[0]}/${c.plural[1]}</span></div>` : ''}
      ${c.propozitii?.[1] ? `<div><span class="muted small">Propoziții</span><b>${pct(c.propozitii[0], c.propozitii[1])}</b><span class="small muted">${c.propozitii[0]}/${c.propozitii[1]}</span></div>` : ''}
      <div><span class="muted small">Reprize</span><b>${c.facute}/${c.parti}</b></div></div>
    ${c.necunoscute?.length ? `<details class="small"><summary>Cuvinte pe care nu le cunoșteai (${c.necunoscute.length})</summary>${chips(c.necunoscute)}</details>` : ''}</section>`;

  if (p.recente?.length) h += `<section class="card"><h2>Greșeli recente</h2><ul class="sum-list">${p.recente.map(g =>
    `<li><div class="s">${esc(g.text)}</div><div class="small muted">ai scris <s>${esc(g.raspuns || '—')}</s>, corect: <b>${esc(g.corect)}</b> · ${esc(g.data)}</div></li>`).join('')}</ul></section>`;

  if (p.grupuri?.length) h += `<section class="card"><h2>Toate regulile</h2>${p.grupuri.map(g =>
    `<details class="grp"><summary>${esc(g.nume)} <span class="small muted">(${g.etichete.length})</span></summary>${meters(g.etichete)}</details>`).join('')}</section>`;
  return h;
}
function viewAcasa() {
  return `<div class="home"><div>${nextCard()}${boardCard()}${queueCard()}${INSTALL ? installCard() : ''}</div><div>${profileHTML()}</div></div>`;
}
function viewSetari() {
  return `<h2 class="settings-h" style="margin-top:8px">Setări</h2>
  <section class="card"><h2>Conexiunea cu datele</h2>
    <p class="muted small">Lecțiile și rezultatele stau în repo-ul tău privat de pe GitHub. Tokenul rămâne doar pe acest dispozitiv.</p>
    <div class="grid2">
      <label class="f">Utilizator GitHub<input type="text" id="gh-owner" value="${esc(GH.owner)}" autocomplete="off"></label>
      <label class="f">Repo de date<input type="text" id="gh-repo" value="${esc(GH.repo)}" autocomplete="off"></label>
    </div>
    <label class="f">Token<input type="password" id="gh-token" placeholder="${GH.token ? 'salvat pe acest dispozitiv' : 'github_pat_…'}" autocomplete="off"></label>
    <div class="row">
      <button class="btn primary" data-act="gh-save">${GH.token ? 'Salvează' : 'Conectează'}</button>
      <button class="btn" data-act="gh-test" ${GH.token ? '' : 'disabled'}>Testează scrierea</button>
      ${GH.token ? '<button class="btn danger" data-act="gh-forget">Șterge tokenul</button>' : ''}
    </div>
    ${S.msg ? `<div class="msg ${S.msg.bad ? 'bad' : 'ok'}">${S.msg.text}</div>` : ''}
    <details class="small" style="margin-top:12px"><summary>Cum obțin tokenul</summary>
      <ol class="steps">
        <li>Deschide <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained token nou</a>.</li>
        <li>Nume: <b>SmartDeutschLehrer</b>; expirare: cât vrei (de exemplu 1 an).</li>
        <li>Repository access: <b>Only select repositories</b> → <b>deutsch-lehrer-date</b>.</li>
        <li>Permissions → Repository → <b>Contents: Read and write</b>. Nimic altceva.</li>
        <li>Generează, copiază tokenul și lipește-l mai sus.</li>
      </ol></details></section>
  <section class="card"><h2>Tastatura germană</h2>
    <p class="muted small">Sub fiecare căsuță de răspuns ai butoanele de mai jos. Încearcă: scrie <i>die Häuser</i>.</p>
    <label class="f">Probă<input type="text" id="try-umlaut" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    ${umlautBar('try-umlaut')}</section>
  ${installCard()}
  <section class="card"><h2>Aplicația</h2><p class="small muted">Versiunea ${APP_VERSION} · dispozitiv ${esc(deviceId())}${QUEUE.length ? ` · ${QUEUE.length} în așteptare` : ''}</p>
    <div class="row"><button class="btn" data-act="sync">Sincronizează acum</button><button class="btn" data-act="update">Caută actualizări</button></div></section>`;
}
function render() {
  // the header chip only speaks when something is off (offline, not connected, results waiting); "connected" is the quiet normal
  const conn = document.getElementById('conn');
  const cText = S.syncing ? 'sincronizez…' : !GH.token ? 'neconectat' : !S.connected ? 'offline' : QUEUE.length ? `${QUEUE.length} netrimise` : '';
  conn.textContent = cText; conn.hidden = !cText; conn.classList.toggle('warn', !S.syncing && !!cText);
  document.getElementById('gear').classList.toggle('on', S.tab === 'setari' && !S.run);
  document.body.classList.toggle('in-lesson', !!S.run);
  const lineOf = S.run ? (S.run.tab === 'calibrare' ? CAL_C : TABS.find(x => x.id === S.run.tab)?.c) : TABS.find(x => x.id === S.tab)?.c;
  document.body.style.setProperty('--lc', lineOf || CAL_C);
  const nav = document.getElementById('tabs');
  nav.innerHTML = TABS.filter(t => !t.hidden).map(t => {
    const n = LESSON_TABS.includes(t.id) ? available(t.id).length : 0;
    return `<button data-tab="${t.id}" class="${S.tab === t.id ? 'on' : ''}" style="--lc:${t.c}">${badge(t)}<span>${esc(t.name)}</span>${n ? `<span class="cnt" title="${n} lecții pregătite">${n}</span>` : ''}</button>`;
  }).join('');
  const on = nav.querySelector('.on');  // keep the current tab visible when the bar scrolls (phone)
  if (on && nav.scrollWidth > nav.clientWidth) {
    if (on.offsetLeft < nav.scrollLeft) nav.scrollLeft = on.offsetLeft - 4;
    else if (on.offsetLeft + on.offsetWidth > nav.scrollLeft + nav.clientWidth) nav.scrollLeft = on.offsetLeft + on.offsetWidth - nav.clientWidth + 4;
  }
  tabFade();
  const t = TABS.find(x => x.id === S.tab) || TABS[0];
  document.getElementById('view').innerHTML = S.run ? viewRun() : t.id === 'acasa' ? viewAcasa() : t.id === 'setari' ? viewSetari() : viewLesson(t);
  if (S.run && !S.run.finished) {
    const a = document.getElementById('ans'); if (a) a.focus({ preventScroll: true });
    const n = document.getElementById('next-btn'); if (n) n.focus({ preventScroll: true });
  }
}

function tabFade() {
  const nav = document.getElementById('tabs');
  nav.classList.toggle('more-l', nav.scrollLeft > 2);
  nav.classList.toggle('more-r', nav.scrollLeft + nav.clientWidth < nav.scrollWidth - 2);
}
document.getElementById('tabs').addEventListener('scroll', tabFade, { passive: true });
window.addEventListener('resize', tabFade);

/* ---------- word tooltips: hover on PC, tap on phone ---------- */
const tipEl = document.getElementById('tip');
let tipFor = null;
function showTip(el) {
  const item = S.run && runItem(); if (!item) return;
  const w = el.dataset.w, g = glossOf(item, w); if (!g) return;
  if (S.run && !S.run.glossSeen.includes(w)) { S.run.glossSeen.push(w); saveRun(); }
  tipEl.textContent = g; tipEl.hidden = false;
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2; x = Math.max(8, Math.min(x, innerWidth - tw - 8));
  let y = r.top - th - 8; if (y < 8) y = r.bottom + 8;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
  document.querySelectorAll('.w.tip-on').forEach(x => x.classList.remove('tip-on'));
  el.classList.add('tip-on'); tipFor = el;
}
function hideTip() { tipEl.hidden = true; tipFor?.classList.remove('tip-on'); tipFor = null; }
document.addEventListener('pointerover', e => { if (e.pointerType === 'mouse') { const w = e.target.closest('.w, .tile'); if (w) showTip(w); } });
document.addEventListener('pointerout', e => { if (e.pointerType === 'mouse' && e.target.closest('.w, .tile')) hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });

/* ---------- events ---------- */
document.addEventListener('mousedown', e => { if (e.target.closest('.umlauts button')) e.preventDefault(); }); // keep focus in the input
document.addEventListener('submit', e => { if (e.target.matches('[data-act="check"]')) { e.preventDefault(); check(); } });
document.addEventListener('click', async e => {
  const w = e.target.closest('.w');
  if (w && !w.closest('[data-act]')) { if (tipFor === w) hideTip(); else showTip(w); return; }
  if (tipFor) hideTip();
  const u = e.target.closest('.umlauts button');
  if (u) { const input = document.getElementById(u.parentElement.dataset.target); if (input) insertAtCursor(input, u.dataset.ch); return; }
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; S.msg = null; store.set('sdl-tab', S.tab); render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'FORM') return;
  const act = b.dataset.act;
  if (act === 'start') startLesson(b.dataset.path);
  else if (act === 'cal-art') {  // no re-render: it would wipe what is already typed in the plural box
    S.run.pick = b.dataset.art; saveRun();
    document.querySelectorAll('.cal-art').forEach(x => x.classList.toggle('on', x === b));
    document.getElementById('cal-need')?.setAttribute('hidden', '');
    document.getElementById('ans')?.focus();
  }
  else if (act === 'cal-unknown') checkCal(true);
  else if (act === 'tile' || act === 'untile' || act === 'order-reset') {
    const r = S.run; if (!r || r.state) return;
    r.placed = r.placed || [];
    if (act === 'tile') { const i = +b.dataset.i; if (!r.placed.includes(i)) r.placed.push(i); }
    else if (act === 'untile') r.placed.splice(+b.dataset.k, 1);
    else r.placed = [];
    hideTip(); saveRun(); render();
    if (act === 'tile' && r.placed.length === runItem()?.bucati.length) document.getElementById('order-check')?.focus({ preventScroll: true });
  }
  else if (act === 'order-check') check();
  else if (act === 'ro') { const l = document.getElementById('ro-line'); l.hidden = !l.hidden; if (!l.hidden && S.run) { S.run.roSeen = true; saveRun(); } }
  else if (act === 'next') next();
  else if (act === 'quit') {
    if (S.run && !S.run.finished && S.run.pos > 0 && !confirm('Ieși din lecție? Progresul din ea se pierde, iar lecția rămâne disponibilă.')) return;
    quit();
  }
  else if (act === 'gh-save') {
    GH.owner = document.getElementById('gh-owner').value.trim() || GH.owner;
    GH.repo = document.getElementById('gh-repo').value.trim() || GH.repo;
    const tok = document.getElementById('gh-token').value.trim();
    if (tok) GH.token = tok;
    store.set('sdl-gh', GH);
    S.msg = { text: 'Verific legătura…' }; render();
    await refresh();
    if (S.connected) { S.msg = { text: 'Conectat. Repo-ul de date e vizibil.' }; render(); }
  } else if (act === 'gh-forget') {
    GH.token = ''; store.set('sdl-gh', GH); S.connected = false; S.msg = { text: 'Tokenul a fost șters de pe acest dispozitiv.' }; render();
  } else if (act === 'gh-test') {
    b.disabled = true; S.msg = { text: 'Fac un commit de test…' }; render();
    try {
      const body = JSON.stringify({ device: deviceId(), app: APP_VERSION, at: new Date().toISOString(), ua: navigator.userAgent.slice(0, 120) }, null, 2) + '\n';
      const c = await commitFiles({ [`stare/conexiuni/${deviceId()}.json`]: body }, 'App: test conexiune');
      S.msg = { text: `Scrierea merge. Commit ${esc(c.sha.slice(0, 7))} în ${esc(GH.repo)}.` };
    } catch (err) { S.msg = { bad: true, text: errText(err) }; }
    render();
  } else if (act === 'sync') { S.msg = null; await refresh(); }
  else if (act === 'flush') {
    b.disabled = true; b.textContent = 'Trimit…';
    const tick = setInterval(() => { b.textContent = 'Trimit… ' + STEP; }, 500);
    try { await flushQueue(); await pullLessons(); S.connected = true; S.msg = null; } catch (err) { /* reason stored in sdl-lasterr */ }
    clearInterval(tick);
    render();
  }
  else if (act === 'install') {
    if (INSTALL) { INSTALL.prompt(); await INSTALL.userChoice.catch(() => {}); INSTALL = null; render(); }
  } else if (act === 'update') {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) await reg.update();
    location.reload();
  }
});
// Enter on the feedback screen moves on (the answer box handles its own Enter through the form)
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && S.run && S.run.state && !S.run.finished && !e.target.closest('form')) { e.preventDefault(); next(); }
  else if (e.key === 'Enter' && S.run && !S.run.state && !S.run.finished && runItem()?.tip === 'ordine' && !e.target.closest('button')) { e.preventDefault(); check(); }
  if (e.key === 'Escape') hideTip();
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
refresh();
</script>
</body>
</html>
